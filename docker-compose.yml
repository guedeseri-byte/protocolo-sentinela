services:
  # ── Portal Sentinela ──────────────────────────────────────────
  portal:
    build: ./portal
    container_name: sentinela-portal
    restart: unless-stopped
    environment:
      - SENTINELA_VERSION=0.1.0
      - KIWIX_URL=http://kiwix:8080
      - OLLAMA_URL=http://ollama:11434
      - OPENWEBUI_URL=http://open-webui:8080
    volumes:
      - portal-data:/app/data
    networks:
      - sentinela
    labels:
      - "sentinela.module=portal"

  # ── Kiwix — Biblioteca Offline (Wikipedia, Wikibooks, Gutenberg) ─
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.7.0
    container_name: sentinela-kiwix
    restart: unless-stopped
    command: /data/*.zim
    volumes:
      - kiwix-data:/data
    networks:
      - sentinela
    labels:
      - "sentinela.module=biblioteca"

  # ── Caddy — Proxy Reverso ─────────────────────────────────────
  caddy:
    image: caddy:2.9.1-alpine
    container_name: sentinela-caddy
    restart: unless-stopped
    ports:
      - "${SENTINELA_PORT:-80}:80"
      - "${SENTINELA_PORT_HTTPS:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - sentinela
    depends_on:
      - portal
      - kiwix

  # ── Ollama — IA Local (opcional) ──────────────────────────────
  ollama:
    image: ollama/ollama:0.6.2
    container_name: sentinela-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - sentinela
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - ia

  # ── Open WebUI — Interface de Chat com IA ─────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.5
    container_name: sentinela-openwebui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
      - ENABLE_SIGNUP=false
    volumes:
      - openwebui-data:/app/backend/data
    networks:
      - sentinela
    depends_on:
      - ollama
    profiles:
      - ia

  # ── Kolibri — Educação Offline ────────────────────────────────
  kolibri:
    image: learningequality/kolibri:0.16.2
    container_name: sentinela-kolibri
    restart: unless-stopped
    environment:
      - KOLIBRI_LISTEN_PORT=8080
    volumes:
      - kolibri-data:/root/.kolibri
    networks:
      - sentinela
    profiles:
      - educacao

volumes:
  portal-data:
  kiwix-data:
  caddy-data:
  caddy-config:
  ollama-data:
  openwebui-data:
  kolibri-data:

networks:
  sentinela:
    name: sentinela
